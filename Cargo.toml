[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.91"

[workspace.dependencies]
anyhow = "1.0.104"
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["vendored", "crypto-rust"] }
dirs = "7.0.0"
eframe = "0.37.0"
egui = "0.37.0"
egui_kittest = "0.37.0"
glob = "0.3.4"
keyring-core = "1.0.1"
opendal = "0.58.2"
reqwest = { version = "0.13.5", default-features = false }
rfd = "0.18.0"
rustic_backend = "=0.7.0"
rustic_core = "=0.13.0"
serde = "1.0.229"
serde-saphyr = "2.1.1"
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
windows-native-keyring-store = "1.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

# Unoptimised scrypt key derivation made the storage tests take ~38 s; now ~1.4 s.
[profile.dev.package.scrypt]
opt-level = 3
