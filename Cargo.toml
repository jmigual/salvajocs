[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.9.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/jmigual/salvajocs"

[workspace.dependencies]
anyhow = "1.0.104"
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["vendored", "crypto-rust"] }
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false }
egui = "0.37.0"
egui_kittest = "0.37.0"
glob = "0.3.4"
keyring-core = "1.0.1"
opendal = "0.59.5"
reqwest = { version = "0.13.5", default-features = false }
rfd = { version = "0.18.0", default-features = false }
rustic_backend = "=0.8.0"
rustic_core = "=0.13.0"
salvajocs-core = { path = "crates/salvajocs-core", version = "0.9.1" }
semver = "1.0.28"
serde = "1.0.229"
serde-saphyr = "2.2.0"
serde_json = "1.0.154"
sha2 = "0.11.1"
similar = "3.2.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
windows-native-keyring-store = "1.1.0"
windows-registry = "0.6.1"
winresource = "0.1.34"

[workspace.lints.rust]
unsafe_code = "forbid"

# Unoptimised scrypt key derivation made the storage tests take ~38 s; now ~1.4 s.
[profile.dev.package.scrypt]
opt-level = 3

# Line tables keep file and line numbers in backtraces; full debug info made each build folder
# about three times bigger (12 GB against 4 GB) and its links slower.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
