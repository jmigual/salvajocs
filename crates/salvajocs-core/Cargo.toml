[package]
name = "salvajocs-core"
version.workspace = true
description = "Game-save scanning, backup and cross-OS restore into a restic-format repository"
keywords = ["backup", "restic", "game-saves", "wine", "proton"]
categories = ["filesystem", "games"]
documentation = "https://docs.rs/salvajocs-core"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dirs.workspace = true
glob.workspace = true
keyring-core.workspace = true
opendal.workspace = true
reqwest = { workspace = true, features = ["blocking", "gzip", "rustls"] }
rustic_backend.workspace = true
rustic_core.workspace = true
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde-saphyr.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store.workspace = true

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store.workspace = true
windows-registry.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
