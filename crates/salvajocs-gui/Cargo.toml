[package]
name = "salvajocs"
version.workspace = true
description = "Desktop app that backs up and restores game saves in a restic-format repository, across Linux, Wine/Proton and Windows"
readme = "../../README.md"
keywords = ["backup", "restic", "game-saves", "wine", "proton"]
categories = ["filesystem", "games", "gui"]
edition.workspace = true
rust-version.workspace = true
# The code is MIT; the binary embeds Atkinson Hyperlegible Next (OFL-1.1, assets/fonts) and egui's
# default fonts Ubuntu Light (Ubuntu-font-1.0) and Hack (MIT, with Bitstream Vera glyphs).
license = "MIT AND OFL-1.1 AND Ubuntu-font-1.0 AND Bitstream-Vera"
repository.workspace = true

[lib]
name = "salvajocs_gui"
path = "src/lib.rs"

[[bin]]
name = "salvajocs"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
dirs.workspace = true
# glow instead of the default wgpu: a lighter renderer that needs no GPU stack at build time.
eframe = { workspace = true, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "system_fonts", "wayland", "x11"] }
rfd = { workspace = true, features = ["xdg-portal"] }
salvajocs-core.workspace = true
thiserror.workspace = true

[build-dependencies]
winresource.workspace = true

[features]
# Dev-only: builds `tests/appearance.rs`, which renders the README screenshots. `wgpu` provides
# `Harness::render`, `snapshot` the PNG encoding; both pull in the whole wgpu stack, so they stay
# off in normal builds and CI. An adapter is needed only when the ignored tests run with
# SALVAJOCS_SCREENSHOTS set.
screenshots = ["egui_kittest/snapshot", "egui_kittest/wgpu"]

[[test]]
name = "appearance"
required-features = ["screenshots"]

[dev-dependencies]
egui_kittest.workspace = true
# Used by `tests/appearance.rs` alone, to give fixture snapshots a made-up host and time, which
# `salvajocs_core::storage::Storage` cannot (it stamps this machine's host and the current time).
rustic_backend.workspace = true
rustic_core.workspace = true
tempfile.workspace = true

[lints]
workspace = true
