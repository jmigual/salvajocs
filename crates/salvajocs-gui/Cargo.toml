[package]
name = "salvajocs-gui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "salvajocs_gui"
path = "src/lib.rs"

[[bin]]
name = "salvajocs"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
dirs.workspace = true
# glow instead of the default wgpu: a lighter renderer that needs no GPU stack at build time.
eframe = { workspace = true, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "system_fonts", "wayland", "x11"] }
rfd = { workspace = true, features = ["xdg-portal"] }
salvajocs-core = { path = "../salvajocs-core" }
thiserror.workspace = true

[dev-dependencies]
# `tests/appearance.rs` renders screens to PNGs for the README: `wgpu` provides `Harness::render`,
# `snapshot` the PNG encoding. An adapter is needed only when that ignored test runs with
# SALVAJOCS_SCREENSHOTS set.
egui_kittest = { workspace = true, features = ["snapshot", "wgpu"] }
# Used by `tests/appearance.rs` alone, to give fixture snapshots a made-up host and time, which
# `salvajocs_core::storage::Storage` cannot (it stamps this machine's host and the current time).
rustic_backend.workspace = true
rustic_core.workspace = true
tempfile.workspace = true

[lints]
workspace = true
