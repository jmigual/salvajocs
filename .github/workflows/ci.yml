name: CI

on:
  push:
    branches: [main, "ci/**"]
    paths-ignore: ["**.md", "docs/**", "LICENSE", "packaging/flatpak/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", "packaging/flatpak/**"]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # No debug info: faster builds and a smaller cache; CI never attaches a debugger.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # No Secret Service daemon on the Linux runner.
            test-args: --skip keyring_
          - os: windows-latest
            test-args: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          # Branch runs reuse main's cache but do not store their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: runner.os == 'Linux'
        run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # --no-fail-fast: one failing test binary does not hide the failures in the others.
      - run: cargo test --workspace --no-fail-fast -- --include-ignored ${{ matrix.test-args }}
