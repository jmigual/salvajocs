name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match the workspace version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "salvajocs") | .version')
          test "v$version" = "$GITHUB_REF_NAME"

  binaries:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest runner image: the binary links the runner's glibc, so older is more compatible.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --bin salvajocs --target ${{ matrix.target }}
      # Named and laid out as cargo-binstall expects by default, so `cargo binstall salvajocs`
      # needs no [package.metadata.binstall]: <name>-<target>-v<version>.<ext> holding a
      # <name>-<target>-v<version>/ directory.
      - name: Package
        run: |
          dir="salvajocs-${{ matrix.target }}-$GITHUB_REF_NAME"
          mkdir "$dir"
          cp LICENSE README.md "$dir/"
          if [ "${{ runner.os }}" = Windows ]; then
            cp "target/${{ matrix.target }}/release/salvajocs.exe" "$dir/"
            7z a "$dir.zip" "$dir"
          else
            cp "target/${{ matrix.target }}/release/salvajocs" "$dir/"
            tar czf "$dir.tgz" "$dir"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: |
            salvajocs-*.tgz
            salvajocs-*.zip
          if-no-files-found: error

  appimage:
    needs: binaries
    runs-on: ubuntu-22.04
    env:
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
      # The runner may lack FUSE; run appimagetool by extracting it instead.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: binaries-x86_64-unknown-linux-gnu
      - name: Build the AppImage
        run: |
          id=io.github.jmigual.salvajocs
          sudo apt-get install -y zsync
          curl -fsSL -o appimagetool "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  appimagetool" | sha256sum --check
          chmod +x appimagetool

          tar xzf salvajocs-*.tgz --strip-components=1 --wildcards '*/salvajocs'
          install -Dm755 salvajocs AppDir/usr/bin/salvajocs
          install -Dm644 packaging/flatpak/$id.desktop AppDir/usr/share/applications/$id.desktop
          install -Dm644 packaging/flatpak/$id.metainfo.xml AppDir/usr/share/metainfo/$id.metainfo.xml
          install -Dm644 crates/salvajocs-gui/assets/$id.png AppDir/usr/share/icons/hicolor/256x256/apps/$id.png
          install -Dm644 crates/salvajocs-gui/assets/$id.svg AppDir/usr/share/icons/hicolor/scalable/apps/$id.svg
          # appimagetool wants the desktop file and icon at the AppDir root.
          ln -s usr/bin/salvajocs AppDir/AppRun
          ln -s usr/share/applications/$id.desktop AppDir/$id.desktop
          ln -s usr/share/icons/hicolor/256x256/apps/$id.png AppDir/$id.png
          ln -s $id.png AppDir/.DirIcon

          # AppImageUpdate (and Gear Lever) read this to find newer releases and their .zsync.
          # --no-appstream: skip validating the metainfo, the runner's appstreamcli is old.
          ARCH=x86_64 ./appimagetool --no-appstream \
            -u 'gh-releases-zsync|jmigual|salvajocs|latest|salvajocs-*-x86_64.AppImage.zsync' \
            AppDir "salvajocs-${GITHUB_REF_NAME#v}-x86_64.AppImage"
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: |
            salvajocs-*-x86_64.AppImage
            salvajocs-*-x86_64.AppImage.zsync
          if-no-files-found: error

  crates:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_KEY }}
