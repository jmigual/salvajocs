name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match the workspace version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "salvajocs") | .version')
          test "v$version" = "$GITHUB_REF_NAME"
      - name: CHANGELOG.md must have a section for the version
        run: grep -qF -- "## [${GITHUB_REF_NAME#v}] " CHANGELOG.md

  binaries:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest runner image: the binary links the runner's glibc, so older is more compatible.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --bin salvajocs --target ${{ matrix.target }}
      # Named and laid out as cargo-binstall expects by default, so `cargo binstall salvajocs`
      # needs no [package.metadata.binstall]: <name>-<target>-v<version>.<ext> holding a
      # <name>-<target>-v<version>/ directory.
      - name: Package
        run: |
          dir="salvajocs-${{ matrix.target }}-$GITHUB_REF_NAME"
          mkdir "$dir"
          cp LICENSE README.md "$dir/"
          cp crates/salvajocs-gui/assets/fonts/*LICENSE.txt crates/salvajocs-gui/assets/fonts/OFL.txt "$dir/"
          if [ "${{ runner.os }}" = Windows ]; then
            cp "target/${{ matrix.target }}/release/salvajocs.exe" "$dir/"
            7z a "$dir.zip" "$dir"
          else
            cp "target/${{ matrix.target }}/release/salvajocs" "$dir/"
            tar czf "$dir.tgz" "$dir"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: |
            salvajocs-*.tgz
            salvajocs-*.zip
          if-no-files-found: error

  appimage:
    needs: binaries
    runs-on: ubuntu-22.04
    env:
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
      # Pinned so the runtime baked into the AppImage is not whatever appimagetool downloads.
      RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
      RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
      # The runner may lack FUSE; run appimagetool by extracting it instead.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: binaries-x86_64-unknown-linux-gnu
      - name: Build the AppImage
        run: |
          id=io.github.jmigual.salvajocs
          curl -fsSL -o appimagetool "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  appimagetool" | sha256sum --check
          chmod +x appimagetool
          curl -fsSL -o runtime-x86_64 "$RUNTIME_URL"
          echo "$RUNTIME_SHA256  runtime-x86_64" | sha256sum --check

          tar xzf salvajocs-*.tgz --strip-components=1 --wildcards '*/salvajocs'
          install -Dm755 salvajocs AppDir/usr/bin/salvajocs
          install -Dm644 packaging/flatpak/$id.desktop AppDir/usr/share/applications/$id.desktop
          install -Dm644 packaging/flatpak/$id.metainfo.xml AppDir/usr/share/metainfo/$id.metainfo.xml
          install -Dm644 crates/salvajocs-gui/assets/$id.png AppDir/usr/share/icons/hicolor/256x256/apps/$id.png
          install -Dm644 crates/salvajocs-gui/assets/$id.svg AppDir/usr/share/icons/hicolor/scalable/apps/$id.svg
          install -Dm644 -t AppDir/usr/share/licenses/$id LICENSE crates/salvajocs-gui/assets/fonts/*LICENSE.txt crates/salvajocs-gui/assets/fonts/OFL.txt
          # A script, not a symlink: the process is then named salvajocs, not AppRun.
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          exec "${APPDIR:-$(dirname "$0")}/usr/bin/salvajocs" "$@"
          EOF
          chmod 755 AppDir/AppRun
          # appimagetool wants the desktop file and icon at the AppDir root.
          ln -s usr/share/applications/$id.desktop AppDir/$id.desktop
          ln -s usr/share/icons/hicolor/256x256/apps/$id.png AppDir/$id.png
          ln -s $id.png AppDir/.DirIcon

          # AppImageUpdate (and Gear Lever) read this to find newer releases and their .zsync.
          # --no-appstream: skip validating the metainfo, the runner's appstreamcli is old.
          ARCH=x86_64 ./appimagetool --no-appstream --runtime-file runtime-x86_64 \
            -u 'gh-releases-zsync|jmigual|salvajocs|latest|salvajocs-*-x86_64.AppImage.zsync' \
            AppDir "salvajocs-${GITHUB_REF_NAME#v}-x86_64.AppImage"
          test -f "salvajocs-${GITHUB_REF_NAME#v}-x86_64.AppImage.zsync"
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: |
            salvajocs-*-x86_64.AppImage
            salvajocs-*-x86_64.AppImage.zsync
          if-no-files-found: error

  installer:
    needs: binaries
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: binaries-x86_64-pc-windows-msvc
      - name: Build the installer
        run: |
          # Inno Setup is preinstalled on the runner image; iscc may not be on PATH.
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue)?.Source ?? "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring(1)
          Expand-Archive "salvajocs-x86_64-pc-windows-msvc-$tag.zip" -DestinationPath unpacked
          $exe = (Resolve-Path "unpacked/*/salvajocs.exe").Path
          & $iscc "/DAppVersion=$version" "/DSourceExe=$exe" "/O$($PWD.Path)" packaging/windows/salvajocs.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "salvajocs-$version-x86_64-setup.exe")) { throw "installer was not produced" }
      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: salvajocs-*-x86_64-setup.exe
          if-no-files-found: error

  # After `release`, so a missing signing secret fails the run before a version that cannot be
  # published twice goes to crates.io.
  crates:
    needs: [check, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A crate already on crates.io (published by hand before tagging) is skipped.
      - name: Publish the crates that are not yet on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          packages=()
          for crate in salvajocs-core salvajocs; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "$GITHUB_REPOSITORY release workflow" \
              "https://crates.io/api/v1/crates/$crate/$version")
            case "$status" in
              200) echo "$crate $version is already published" ;;
              404) packages+=(-p "$crate") ;;
              *) echo "crates.io answered $status for $crate" >&2; exit 1 ;;
            esac
          done
          if [ "${#packages[@]}" -gt 0 ]; then
            cargo publish --locked "${packages[@]}"
          fi

  release:
    needs: [binaries, appimage, installer]
    runs-on: ubuntu-latest
    # The environment's required reviewer approves a release before it is signed.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.md
            crates/salvajocs-core/src/update/salvajocs.pub
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # One `sha256sum` line per asset; the in-app updater verifies the installer and the AppImage
      # against it.
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS
      # Built from source with the version pinned, in a step without the secret: its dependencies'
      # build scripts run here. It writes the minisign format the app verifies.
      - name: Install rsign2
        run: cargo install rsign2 --version 0.6.7 --locked
      # The updater refuses a release whose SHA256SUMS lacks this signature (ADR-0013).
      - name: Sign the checksums
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "the MINISIGN_SECRET_KEY secret is not set" >&2
            exit 1
          fi
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          rsign sign -W -s "$key" -x dist/SHA256SUMS.minisig dist/SHA256SUMS
          # Fails when the secret is not the key whose public half the app embeds.
          rsign verify -p crates/salvajocs-core/src/update/salvajocs.pub -x dist/SHA256SUMS.minisig dist/SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # The notes are the version's CHANGELOG.md section; --generate-notes appends the compare link.
        run: |
          awk -v h="## [${GITHUB_REF_NAME#v}]" '/^## \[/ { p = index($0, h) == 1; next } /^\[.*\]: / { p = 0 } p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --notes-file notes.md --generate-notes --verify-tag
